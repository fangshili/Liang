<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liang 光标光晕方案 V2 · 圆环脉冲</title>
  <style>
    :root {
      --idle: #E58325;
      --processing: #00BFFF;
      --waiting: #FFD700;
      --success: #00FF52;
      --error: #FF3B30;
      --state: var(--processing);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(0,191,255,0.06), transparent 45%),
        linear-gradient(180deg, #0F172A 0%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: #E2E8F0;
      user-select: none;
    }

    .desktop { position: absolute; inset: 0; }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28px;
      background: rgba(15,23,42,0.72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }

    .notch-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 34px;
      border-radius: 0 0 18px 18px;
      box-shadow:
        inset 0 -2px 10px var(--state),
        0 4px 28px var(--state),
        0 0 60px var(--state);
      opacity: 0.85;
      animation: breathing 3s ease-in-out infinite;
      pointer-events: none;
    }

    .cursor {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      transform: translate(-2px, -2px);
      z-index: 10;
    }
    .cursor svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }

    .orb {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 9;
      transform: translate(16px, 16px);
    }

    .orb::before, .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .orb::before {
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 60%);
      border: 2px solid var(--state);
      box-shadow: 0 0 12px var(--state), 0 0 26px var(--state);
      animation: ringPulse 1.8s ease-in-out infinite;
    }

    .orb::after {
      width: 10px;
      height: 10px;
      top: 8px;
      left: 8px;
      background: var(--state);
      box-shadow: 0 0 8px var(--state);
      animation: corePulse 1.8s ease-in-out infinite;
    }

    .controls {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(15,23,42,0.78);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
    }

    .controls button {
      appearance: none;
      border: none;
      background: rgba(255,255,255,0.08);
      color: #E2E8F0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .controls button:hover { background: rgba(255,255,255,0.16); }
    .controls button.active { background: rgba(255,255,255,0.24); font-weight: 600; }

    .label {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.7);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.08);
    }

    @keyframes breathing {
      0%, 100% { opacity: 0.72; transform: translateX(-50%) scale(0.96); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="desktop" id="desktop">
    <div class="topbar">Liang Cursor Glow V2 · 圆环脉冲</div>
    <div class="notch-glow" id="notchGlow"></div>
    <div class="label">移动鼠标查看跟随效果 · 点击下方状态切换颜色/动画</div>

    <div class="cursor" id="cursor">
      <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87a.5.5 0 0 0 .35-.85L6.35 2.86a.5.5 0 0 0-.85.35Z"/>
      </svg>
    </div>
    <div class="orb" id="orb"></div>
  </div>

  <div class="controls">
    <button data-state="idle">空闲</button>
    <button data-state="processing" class="active">处理中</button>
    <button data-state="waiting">等待确认</button>
    <button data-state="success">成功</button>
    <button data-state="error">错误</button>
  </div>

  <script>
    const root = document.documentElement;
    const cursor = document.getElementById('cursor');
    const orb = document.getElementById('orb');
    const desktop = document.getElementById('desktop');
    const buttons = document.querySelectorAll('.controls button');

    let cx = window.innerWidth / 2;
    let cy = window.innerHeight / 2;

    desktop.addEventListener('mousemove', (e) => {
      cx = e.clientX;
      cy = e.clientY;
      cursor.style.left = cx + 'px';
      cursor.style.top = cy + 'px';
      orb.style.left = cx + 'px';
      orb.style.top = cy + 'px';
    });

    cursor.style.left = cx + 'px';
    cursor.style.top = cy + 'px';
    orb.style.left = cx + 'px';
    orb.style.top = cy + 'px';

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        root.style.setProperty('--state', `var(--${btn.dataset.state})`);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liang 设置 - 方案三：分组折叠面板</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --text: #1D1D1F;
    --text-secondary: #6E6E73;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 20px 60px rgba(0,0,0,0.12);
    --accent: #007AFF;
    --success: #34C759;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #E5E5EA; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text);
  }
  .window {
    width: 480px; height: 620px; background: var(--bg); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  }
  .header { padding: 18px 20px 6px; }
  .header h1 { font-size: 20px; margin: 0; }
  .header p { font-size: 12px; color: var(--text-secondary); margin: 4px 0 0; }
  .scroll { flex: 1; overflow-y: auto; padding: 10px 20px 20px; }
  .group {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
  }
  .group-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: rgba(0,0,0,0.015);
  }
  .chevron { color: var(--text-secondary); font-size: 11px; }
  .group-body { padding: 6px 14px 10px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-label { font-size: 13px; }
  .row-desc { font-size: 11px; color: var(--text-secondary); }
  .toggle { width: 36px; height: 20px; background: var(--success); border-radius: 10px; position: relative; }
  .toggle::after { content:''; position:absolute; width:16px; height:16px; background:#fff; border-radius:50%; top:2px; right:2px; box-shadow:0 1px 2px rgba(0,0,0,0.15); }
  input[type=range] { width: 120px; }
  .color-list { padding: 4px 0; }
  .color-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); }
  .color-name { font-size: 12px; flex: 1; }
  .hex { font-size: 11px; color: var(--text-secondary); font-family: ui-monospace, monospace; }
  .actions { display: flex; gap: 10px; padding: 4px 0 8px; }
  button { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="window">
  <div class="header">
    <h1>Liang 设置</h1>
    <p>自定义光晕、Cursor Hooks 与状态颜色</p>
  </div>
  <div class="scroll">
    <div class="group">
      <div class="group-header">功能开关 <span class="chevron">▾</span></div>
      <div class="group-body">
        <div class="row"><div><div class="row-label">启用光晕</div></div><div class="toggle"></div></div>
        <div class="row"><div><div class="row-label">启用 Cursor Hooks</div></div><div class="toggle"></div></div>
      </div>
    </div>
    <div class="group">
      <div class="group-header">光晕几何 <span class="chevron">▾</span></div>
      <div class="group-body">
        <div class="row"><span class="row-label">亮度</span><input type="range" value="80"></div>
        <div class="row"><span class="row-label">模糊半径</span><input type="range" value="60"></div>
        <div class="row"><span class="row-label">外侧厚度</span><input type="range" value="55"></div>
        <div class="row"><span class="row-label">内侧厚度</span><input type="range" value="40"></div>
      </div>
    </div>
    <div class="group">
      <div class="group-header">状态颜色 <span class="chevron">▾</span></div>
      <div class="group-body">
        <div class="color-list">
          <div class="color-row"><div class="swatch" style="background:#E58325"></div><span class="color-name">Idle</span><span class="hex">#E58325</span></div>
          <div class="color-row"><div class="swatch" style="background:#00BFFF"></div><span class="color-name">Processing</span><span class="hex">#00BFFF</span></div>
          <div class="color-row"><div class="swatch" style="background:#FFD700"></div><span class="color-name">Waiting</span><span class="hex">#FFD700</span></div>
          <div class="color-row"><div class="swatch" style="background:#00FF52"></div><span class="color-name">Success</span><span class="hex">#00FF52</span></div>
          <div class="color-row"><div class="swatch" style="background:#FF3B30"></div><span class="color-name">Error</span><span class="hex">#FF3B30</span></div>
          <div class="color-row"><div class="swatch" style="background:#808080"></div><span class="color-name">Disconnected</span><span class="hex">#808080</span></div>
        </div>
      </div>
    </div>
    <div class="group">
      <div class="group-header">动画 <span class="chevron">▾</span></div>
      <div class="group-body">
        <div class="row"><div><div class="row-label">呼吸效果</div></div><div class="toggle"></div></div>
        <div class="row"><span class="row-label">呼吸速度</span><input type="range" value="50"></div>
      </div>
    </div>
    <div class="actions">
      <button>复制当前配置</button>
      <button class="primary">恢复默认</button>
    </div>
  </div>
</div>
</body>
</html>

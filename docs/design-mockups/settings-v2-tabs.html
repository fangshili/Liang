<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liang 设置 - 方案二：标签页工具栏</title>
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text: #1D1D1F;
    --text-secondary: #6E6E73;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 20px 60px rgba(0,0,0,0.15);
    --accent: #007AFF;
    --success: #34C759;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #E5E5EA; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text);
  }
  .window {
    width: 560px; height: 600px; background: var(--bg); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  }
  .titlebar {
    padding: 16px 20px 0; font-size: 18px; font-weight: 700;
  }
  .tabs {
    display: flex; gap: 4px; padding: 12px 20px;
  }
  .tab {
    padding: 5px 14px; font-size: 12px; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--text-secondary);
  }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .scroll {
    flex: 1; overflow-y: auto; padding: 0 20px 24px;
  }
  .card {
    background: var(--surface); border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 14px; overflow: hidden;
  }
  .section-title {
    padding: 10px 16px; font-size: 11px; font-weight: 700;
    color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
    background: rgba(0,0,0,0.015); border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-label { font-size: 13px; }
  .row-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .toggle { width: 38px; height: 22px; background: var(--success); border-radius: 11px; position: relative; }
  .toggle::after { content:''; position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:2px; right:2px; box-shadow:0 1px 2px rgba(0,0,0,0.15); }
  input[type=range] { width: 130px; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
  .color-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); }
  .color-name { font-size: 12px; flex: 1; }
  .hex { font-size: 11px; color: var(--text-secondary); font-family: ui-monospace, monospace; }
  .footer { display: flex; gap: 10px; padding: 10px 16px; }
  button { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">Liang 设置</div>
  <div class="tabs">
    <div class="tab active">通用</div>
    <div class="tab">光晕</div>
    <div class="tab">颜色</div>
    <div class="tab">Cursor</div>
  </div>
  <div class="scroll">
    <div class="card">
      <div class="section-title">功能</div>
      <div class="row">
        <div><div class="row-label">启用光晕</div><div class="row-desc">在刘海处显示光晕</div></div>
        <div class="toggle"></div>
      </div>
      <div class="row">
        <div><div class="row-label">启用 Cursor Hooks</div><div class="row-desc">监听 Cursor 事件</div></div>
        <div class="toggle"></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">光晕几何</div>
      <div class="row"><span class="row-label">亮度</span><input type="range" class="slider" value="80"></div>
      <div class="row"><span class="row-label">模糊半径</span><input type="range" class="slider" value="60"></div>
      <div class="row"><span class="row-label">外侧厚度</span><input type="range" class="slider" value="55"></div>
    </div>
    <div class="card">
      <div class="section-title">状态颜色</div>
      <div class="colors">
        <div class="color-row"><div class="swatch" style="background:#E58325"></div><span class="color-name">Idle</span><span class="hex">#E58325</span></div>
        <div class="color-row"><div class="swatch" style="background:#00BFFF"></div><span class="color-name">Processing</span><span class="hex">#00BFFF</span></div>
        <div class="color-row"><div class="swatch" style="background:#FFD700"></div><span class="color-name">Waiting</span><span class="hex">#FFD700</span></div>
        <div class="color-row"><div class="swatch" style="background:#00FF52"></div><span class="color-name">Success</span><span class="hex">#00FF52</span></div>
        <div class="color-row"><div class="swatch" style="background:#FF3B30"></div><span class="color-name">Error</span><span class="hex">#FF3B30</span></div>
        <div class="color-row"><div class="swatch" style="background:#808080"></div><span class="color-name">Disconnected</span><span class="hex">#808080</span></div>
      </div>
    </div>
    <div class="footer">
      <button>复制当前配置</button>
      <button class="primary">恢复默认</button>
    </div>
  </div>
</div>
</body>
</html>

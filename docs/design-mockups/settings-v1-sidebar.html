<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liang 设置 - 方案一：侧边栏（System Settings 风格）</title>
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --sidebar-bg: #F0F0F2;
    --sidebar-active: #FFFFFF;
    --sidebar-active-border: #007AFF;
    --text: #1D1D1F;
    --text-secondary: #6E6E73;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 20px 60px rgba(0,0,0,0.15);
    --accent: #007AFF;
    --danger: #FF3B30;
    --success: #34C759;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #E5E5EA;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .window {
    width: 760px;
    height: 560px;
    background: var(--bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
  }
  .sidebar {
    width: 180px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nav-item {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-item:hover { background: rgba(0,0,0,0.04); }
  .nav-item.active {
    background: var(--sidebar-active);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border-left: 3px solid var(--sidebar-active-border);
    margin-left: -3px;
  }
  .icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
  .content {
    flex: 1;
    padding: 24px 32px;
    overflow-y: auto;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 18px;
  }
  .card {
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    background: rgba(0,0,0,0.015);
    border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-label { font-size: 13px; }
  .row-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .toggle {
    width: 38px; height: 22px; background: var(--success); border-radius: 11px; position: relative;
  }
  .toggle::after { content:''; position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:2px; right:2px; box-shadow:0 1px 2px rgba(0,0,0,0.15); }
  .toggle.off { background: #E5E5EA; }
  .toggle.off::after { right:auto; left:2px; }
  .slider { width: 140px; }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 12px 16px;
  }
  .color-item {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
  }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); }
  .color-name { font-size: 12px; flex: 1; }
  .hex { font-size: 11px; color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, monospace; }
  .footer {
    margin-top: 8px;
    display: flex;
    gap: 12px;
  }
  button {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="window">
  <div class="sidebar">
    <div class="nav-item active"><span class="icon">⚙</span> 通用</div>
    <div class="nav-item"><span class="icon">✨</span> 光晕</div>
    <div class="nav-item"><span class="icon">🖱</span> Cursor</div>
    <div class="nav-item"><span class="icon">🎨</span> 状态颜色</div>
    <div class="nav-item"><span class="icon">⌨</span> 高级</div>
    <div style="flex:1"></div>
    <div class="nav-item"><span class="icon">ℹ</span> 关于</div>
  </div>
  <div class="content">
    <h1>通用</h1>
    <div class="card">
      <div class="card-header">功能开关</div>
      <div class="row">
        <div><div class="row-label">启用光晕</div><div class="row-desc">在刘海周围显示状态光晕</div></div>
        <div class="toggle"></div>
      </div>
      <div class="row">
        <div><div class="row-label">启用 Cursor Hooks</div><div class="row-desc">接收 Cursor IDE 事件</div></div>
        <div class="toggle"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">快速操作</div>
      <div class="row" style="justify-content:flex-start; gap:12px;">
        <button>复制当前配置</button>
        <button class="primary">恢复默认</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
